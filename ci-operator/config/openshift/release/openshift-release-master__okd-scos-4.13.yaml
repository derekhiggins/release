base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
releases:
  initial:
    prerelease:
      product: okd
      version_bounds:
        lower: 4.11.0
        upper: 4.999.0
  latest:
    candidate:
      product: okd
      stream: okd-scos
      version: "4.13"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-aws-ovn
  interval: 48h
  steps:
    cluster_profile: aws-2
    env:
      BASE_DOMAIN: aws-2.ci.openshift.org
    workflow: openshift-e2e-aws
- as: e2e-aws-ovn-upgrade
  interval: 48h
  steps:
    cluster_profile: aws-2
    env:
      BASE_DOMAIN: aws-2.ci.openshift.org
      TEST_TYPE: upgrade-conformance
    workflow: openshift-upgrade-aws
- as: e2e-metal-ipi-sdn-bm
  cluster: build05
  interval: 8h
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      CLUSTERTYPE: baremetal
    workflow: baremetalds-e2e-sdn-ipv4
zz_generated_metadata:
  branch: master
  org: openshift
  repo: release
  variant: okd-scos-4.13
